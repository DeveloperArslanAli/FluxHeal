<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="100%">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="p-glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1100" height="320" rx="14" fill="url(#p-bg)" stroke="#334155" stroke-width="1.5" />

  <text x="550" y="38" font-family="-apple-system, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC" text-anchor="middle">
    FluxHeal 5-Stage Sub-Millisecond Autonomous Loop
  </text>
  <text x="550" y="60" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94A3B8" text-anchor="middle">
    Zero Pipeline Blockage &bull; Hot-Rule Cache &bull; Micro-Quarantine DLQ &bull; Dual-Tier Healer &bull; Confidence Gate
  </text>

  <!-- 5 Horizontal Stage Blocks -->

  <!-- Stage 1 -->
  <g transform="translate(40, 90)">
    <rect width="185" height="175" rx="10" fill="#111827" stroke="#10B981" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#10B981" opacity="0.2" />
    <text x="28" y="33" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#10B981" text-anchor="middle">1</text>
    <text x="50" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">Hot Ingestion</text>
    
    <text x="15" y="70" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Telemetry Ingress</text>
    <text x="15" y="86" font-family="'JetBrains Mono', monospace" font-size="10" fill="#06B6D4">Hot-Rule Cache Check</text>
    <text x="15" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981" font-weight="700">Latency: &lt; 0.06ms</text>
    <text x="15" y="128" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Direct Warehouse Pass</text>
    <rect x="15" y="142" width="155" height="20" rx="4" fill="#1E293B" />
    <text x="92" y="156" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981" text-anchor="middle">STATUS: FAST_PATH_OK</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 230 175 L 255 175" stroke="#EF4444" stroke-width="2" stroke-dasharray="3 3" />

  <!-- Stage 2 -->
  <g transform="translate(260, 90)">
    <rect width="185" height="175" rx="10" fill="#111827" stroke="#EF4444" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#EF4444" opacity="0.2" />
    <text x="28" y="33" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#EF4444" text-anchor="middle">2</text>
    <text x="50" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">Micro-DLQ</text>
    
    <text x="15" y="70" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Anomaly Detected</text>
    <text x="15" y="86" font-family="'JetBrains Mono', monospace" font-size="10" fill="#EF4444">Row-Level Isolation</text>
    <text x="15" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981" font-weight="700">Latency: &lt; 1.0ms</text>
    <text x="15" y="128" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">PostgreSQL quarantine_dlq</text>
    <rect x="15" y="142" width="155" height="20" rx="4" fill="#1E293B" />
    <text x="92" y="156" font-family="'JetBrains Mono', monospace" font-size="9" fill="#EF4444" text-anchor="middle">STATUS: ISOLATED</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 450 175 L 475 175" stroke="#06B6D4" stroke-width="2" />

  <!-- Stage 3 -->
  <g transform="translate(480, 90)">
    <rect width="185" height="175" rx="10" fill="#111827" stroke="#06B6D4" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#06B6D4" opacity="0.2" />
    <text x="28" y="33" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#06B6D4" text-anchor="middle">3</text>
    <text x="50" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">Dual Healer</text>
    
    <text x="15" y="70" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Tier-1 Deterministic</text>
    <text x="15" y="86" font-family="'JetBrains Mono', monospace" font-size="10" fill="#06B6D4">Tier-2 LLM Reflection</text>
    <text x="15" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#EF4444" font-weight="700">Circuit Breaker: 3s SLA</text>
    <text x="15" y="128" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Levenshtein &bull; Regex &bull; EMA</text>
    <rect x="15" y="142" width="155" height="20" rx="4" fill="#1E293B" />
    <text x="92" y="156" font-family="'JetBrains Mono', monospace" font-size="9" fill="#06B6D4" text-anchor="middle">STATUS: DIAGNOSING</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 670 175 L 695 175" stroke="#F59E0B" stroke-width="2" />

  <!-- Stage 4 -->
  <g transform="translate(700, 90)">
    <rect width="185" height="175" rx="10" fill="#111827" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#F59E0B" opacity="0.2" />
    <text x="28" y="33" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#F59E0B" text-anchor="middle">4</text>
    <text x="50" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">Confidence Gate</text>
    
    <text x="15" y="70" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981">&bull; c &ge; 90%: Auto-Heal</text>
    <text x="15" y="86" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F59E0B">&bull; 60-89%: Mobile HITL</text>
    <text x="15" y="102" font-family="'JetBrains Mono', monospace" font-size="10" fill="#EF4444">&bull; &lt; 60%: Retain DLQ</text>
    <text x="15" y="128" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Cache Rule Generation</text>
    <rect x="15" y="142" width="155" height="20" rx="4" fill="#1E293B" />
    <text x="92" y="156" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F59E0B" text-anchor="middle">AUTO_HEALED / HITL</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 890 175 L 915 175" stroke="#10B981" stroke-width="2" />

  <!-- Stage 5 -->
  <g transform="translate(920, 90)">
    <rect width="150" height="175" rx="10" fill="#111827" stroke="#10B981" stroke-width="1.5" />
    <circle cx="28" cy="28" r="14" fill="#10B981" opacity="0.2" />
    <text x="28" y="33" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#10B981" text-anchor="middle">5</text>
    <text x="50" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FFFFFF">Green Ledger</text>
    
    <text x="15" y="70" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">Avoided Backfill</text>
    <text x="15" y="86" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981">Cloud CPU Saved</text>
    <text x="15" y="102" font-family="'JetBrains Mono', monospace" font-size="10" fill="#06B6D4">Energy Wh Saved</text>
    <text x="15" y="128" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981">Avoided Scope 3 CO₂</text>
    <rect x="15" y="142" width="120" height="20" rx="4" fill="#1E293B" />
    <text x="75" y="156" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981" text-anchor="middle">green_ledger</text>
  </g>
</svg>

